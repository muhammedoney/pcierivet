<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 810" role="img" aria-labelledby="title desc">
  <title id="title">Throughput versus payload size</title>
  <desc id="desc">Gen2 and Gen3 x4. The vertical grid is 500 MB/s. Gen2 theoretical bandwidth is 2000 MB/s. Gen3 theoretical bandwidth is 3938 MB/s. Rivet Gen2 x4 MemWr64 printed 250.000, 500.000, 800.000, 1122.807, 1347.368, 1570.552, 1723.906, 1851.718, 1923.005, 1959.809, and 1979.700 MB/s. Rivet Gen2 x4 read printed 77.670, 146.789, 275.862, 444.444, 695.652, 973.384, 1207.547, 1378.197, 1480.839, 1538.115, and 1568.447 MB/s. Rivet Gen3 x4 MemWr64 printed 333.333, 666.667, 1333.333, 1828.571, 1939.394, 2392.523, 2925.714, 3368.421, 3631.206, 3792.593, and 3893.536 MB/s. Rivet Gen3 x4 MemRd64 printed 81.633, 146.789, 326.531, 640.000, 969.697, 1462.857, 2064.516, 2509.804, 2813.187, 2994.152, and 3093.656 MB/s.</desc>
  <rect width="1120" height="810" fill="#ffffff"/>
  <text x="78" y="28" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Throughput vs payload</text>
  <text x="78" y="48" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Same 500 MB/s grid. The axis runs to 4000 MB/s so the Gen3 line fits.</text>
