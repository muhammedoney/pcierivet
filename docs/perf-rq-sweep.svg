<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc">
  <title id="title">Throughput versus payload size</title>
  <desc id="desc">Gen2, Gen3, and Gen4 x4. The vertical grid is 1000 MB/s. Gen2 theoretical bandwidth is 2000 MB/s. Gen3 theoretical bandwidth is 3938 MB/s. Gen4 theoretical bandwidth is 7877 MB/s. Rivet Gen2 x4 MemWr64 printed 250.000, 500.000, 800.000, 1142.857, 1438.202, 1651.613, 1790.210, 1889.299, 1943.074, 1970.178, and 1983.055 MB/s. Rivet Gen2 x4 read printed 79.208, 146.789, 285.714, 450.704, 723.164, 1019.920, 1292.929, 1497.076, 1625.397, 1698.176, and 1737.065 MB/s. Rivet Gen3 x4 MemWr64 printed 333.333, 666.667, 1333.333, 2000.000, 2666.667, 3200.000, 3506.849, 3737.226, 3820.896, 3908.397, and 3953.668 MB/s. Rivet Gen3 x4 MemRd64 printed 108.108, 192.771, 390.244, 711.111, 1185.185, 1630.573, 2226.087, 2752.688, 3103.030, 3313.916, and 3430.486 MB/s. Rivet Gen4 x4 MemWr64 printed 888.889, 1777.778, 3555.556, 3764.706, 5120.000, 6243.902, 7013.699, 7474.453, 7728.302, 7861.804, and 7930.300 MB/s. Rivet Gen4 x4 MemRd64 printed 117.647, 231.884, 450.704, 876.712, 1542.169, 2612.245, 3580.420, 4970.874, 6150.150, 6965.986, and 7447.273 MB/s.</desc>
