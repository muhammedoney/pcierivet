  <title id="title">Rivet x4 throughput versus payload</title>
  <desc id="desc">Three rows, one generation each, on the same 0 to 8000 MB/s scale. Endpoint at PIPE, 4 lanes, eight TLPs per size, 4 ns user clock. Blue is a write and amber is a read. The dashed line is the wire rate. The figures in each row are MB/s at a 4096-byte TLP. Gen4 wire 7877. Gen4 MemWr64 888.889, 1777.778, 3555.556, 4923.077, 6095.238, 6918.919, 7420.290, 7699.248, 7846.743, 7922.631, 7961.127. Gen4 MemRd64 117.647, 231.884, 450.704, 876.712, 1542.169, 2612.245, 3580.420, 4970.874, 6150.150, 6965.986, 7447.273. Gen3 wire 3938. Gen3 MemWr64 333.333, 666.667, 1333.333, 2000.000, 2666.667, 3200.000, 3506.849, 3737.226, 3820.896, 3908.397, 3953.668. Gen3 MemRd64 108.108, 192.771, 390.244, 711.111, 1185.185, 1630.573, 2226.087, 2752.688, 3103.030, 3313.916, 3430.486. Gen2 wire 2000. Gen2 MemWr64 250.000, 500.000, 800.000, 1142.857, 1438.202, 1651.613, 1790.210, 1889.299, 1943.074, 1970.178, 1983.055. Gen2 read 79.208, 146.789, 285.714, 450.704, 723.164, 1019.920, 1292.929, 1497.076, 1625.397, 1698.176, 1737.065.</desc>
