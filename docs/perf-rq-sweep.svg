  <title id="title">Rivet x4 throughput versus payload</title>
  <desc id="desc">Endpoint at PIPE, 4 lanes, eight TLPs per size, 4 ns user clock. Heavy lines are Gen4. Lighter lines are Gen3, then Gen2, on the same 0 to 8000 MB/s scale. Grouped figures at the right are MB/s at a 4096-byte TLP. Gen4 wire 7877 MB/s. Gen4 MemWr64 888.889,1777.778,3555.556,4923.077,6095.238,6918.919,7420.290,7699.248,7846.743,7846.743,7922.631. Gen4 MemRd64 101.266,205.128,359.551,703.297,1280.000,2015.748,3200.000,4612.613,5851.429,6759.076,7327.370. Gen3 wire 3938 MB/s. Gen3 MemWr64 333.333,666.667,1333.333,2000.000,2666.667,3200.000,3555.556,3764.706,3878.788,3938.462,3968.992. Gen3 MemRd64 87.912,172.043,320.000,576.577,914.286,1462.857,2081.301,2639.175,3029.586,3271.565,3407.654. Gen2 wire 2000 MB/s. Gen2 MemWr64 250.000,500.000,800.000,1142.857,1454.545,1684.211,1828.571,1910.448,1954.198,1976.834,1988.350. Gen2 MemRd64 88.889,158.416,285.714,444.444,711.111,1007.874,1286.432,1492.711,1622.821,1696.769,1736.329.</desc>
