<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
  <title id="title">Throughput versus payload size</title>
  <desc id="desc">Gen2 x4. Rivet MemWr32 rates, 8 TLPs per size on a 4 ns user clock, are 250.000, 500.000, 800.000, 1122.807, 1333.333, 1570.552, 1723.906, 1851.718, 1923.005, 1959.809, and 1979.700 MB/s. MemWr64 matches those rates except 1347.368 MB/s at 64 bytes. Rivet MemRd32 and MemRd64 printed the same completion-payload rates: 77.670, 146.789, 275.862, 444.444, 695.652, 973.384, 1207.547, 1378.197, 1480.839, 1538.115, and 1568.447 MB/s. The flat line is the Gen2 x4 symbol rate, 2000 MB/s. The amber line is the posted-write formula published by Xilinx WP350 and Intel AN 456: payload / (payload + 20) times 2000 MB/s. The square at 256 bytes is the AN 456 Stratix IV hard-IP DMA write, 1783 MB/s.</desc>
  <rect width="1120" height="490" fill="#ffffff"/>
  <text x="78" y="28" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Throughput vs payload</text>
  <text x="78" y="48" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Gen2 x4 at 64 bits, 4 ns. MemRd32 and MemRd64 printed the same CplD payload rate.</text>
  <g fill="none" stroke="#d0d7de" stroke-width="1">
    <line x1="78" y1="72" x2="1040" y2="72"/>
    <line x1="78" y1="147" x2="1040" y2="147"/>
    <line x1="78" y1="222" x2="1040" y2="222"/>
    <line x1="78" y1="297" x2="1040" y2="297"/>
    <line x1="78" y1="372" x2="1040" y2="372"/>
  </g>
  <g fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="end">
    <text x="70" y="76">2000</text>
    <text x="70" y="151">1500</text>
    <text x="70" y="226">1000</text>
    <text x="70" y="301">500</text>
    <text x="70" y="376">0</text>
  </g>
  <text x="18" y="230" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" transform="rotate(-90 18 230)">MB/s</text>
